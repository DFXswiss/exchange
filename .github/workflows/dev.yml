name: DEV CI/CD

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: '16.x'

jobs:
  build:
    name: Build and deploy to DEV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install packages
        run: |
          npm ci

      - name: Update WalletConnect PID
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: '{WC_PID}'
          replace: ${{ secrets.DEV_WC_PID}}
          regex: false

      - name: Build code
        run: |
          npm run build:dev

      - name: Run tests
        run: |
          npm run test

      - name: Run linter
        run: |
          npm run lint

      # wrangler@4 requires Node >= 18; the app build above runs on Node 16, so
      # bump Node only for the Wrangler steps without touching the CRA build.
      - name: Use Node.js 20 for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy to Cloudflare Pages (DEV)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy build --project-name=dfx-exchange-dev --branch=develop
